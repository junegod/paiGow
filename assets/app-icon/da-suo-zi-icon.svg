<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">打索子应用图标</title>
  <desc id="description">戴旧布帽的新居村老者与游戏内同款天牌、九点牌</desc>
  <defs>
    <!-- 深绿桌布背景只保留大块明暗，确保缩小后轮廓仍然清楚。 -->
    <radialGradient id="background" cx="36%" cy="24%" r="92%">
      <stop offset="0" stop-color="#1c7a4d"/>
      <stop offset="0.52" stop-color="#07513a"/>
      <stop offset="1" stop-color="#03231f"/>
    </radialGradient>
    <radialGradient id="medallion" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f8de86"/>
      <stop offset="0.62" stop-color="#c58d2d"/>
      <stop offset="1" stop-color="#704714"/>
    </radialGradient>
    <pattern id="felt" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0V32" stroke="#fff" stroke-width="3" stroke-opacity="0.025"/>
    </pattern>

    <!-- 肤色、布帽和衣服采用柔和渐变，突出真实质感而不是平面卡通块。 -->
    <radialGradient id="skin" cx="33%" cy="22%" r="86%">
      <stop offset="0" stop-color="#f0bd91"/>
      <stop offset="0.48" stop-color="#c87c58"/>
      <stop offset="0.8" stop-color="#884737"/>
      <stop offset="1" stop-color="#542a27"/>
    </radialGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b3f33" stop-opacity="0"/>
      <stop offset="1" stop-color="#321b1c" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7b4a9"/>
      <stop offset="0.36" stop-color="#62665f"/>
      <stop offset="1" stop-color="#252c2b"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#315f70"/>
      <stop offset="0.52" stop-color="#173e50"/>
      <stop offset="1" stop-color="#071e2c"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5c59a"/>
      <stop offset="1" stop-color="#9b6847"/>
    </linearGradient>

    <!-- 牌体比例和孔位复用游戏里的修长牌型，不绘制中间分隔线。 -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d1d"/>
      <stop offset="0.2" stop-color="#090a0a"/>
      <stop offset="0.72" stop-color="#010202"/>
      <stop offset="1" stop-color="#0b0c0c"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.66"/>
    </linearGradient>
    <radialGradient id="redPip" cx="67%" cy="24%" r="88%">
      <stop offset="0" stop-color="#ff8b77"/>
      <stop offset="0.18" stop-color="#fa3b2e"/>
      <stop offset="0.64" stop-color="#c80c0d"/>
      <stop offset="1" stop-color="#650106"/>
    </radialGradient>
    <radialGradient id="whitePip" cx="67%" cy="24%" r="88%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.28" stop-color="#fffceb"/>
      <stop offset="0.68" stop-color="#ded7c5"/>
      <stop offset="1" stop-color="#918b80"/>
    </radialGradient>
    <filter id="portraitShadow" x="-20%" y="-20%" width="150%" height="165%">
      <feDropShadow dx="0" dy="25" stdDeviation="24" flood-color="#001814" flood-opacity="0.68"/>
    </filter>
    <filter id="tileShadow" x="-35%" y="-25%" width="180%" height="180%">
      <feDropShadow dx="4" dy="12" stdDeviation="9" flood-color="#00110e" flood-opacity="0.86"/>
    </filter>

    <!-- 每个孔由暗色内缘、漆面和右上方小高光组成，表现凹入牌体的效果。 -->
    <g id="pipRed">
      <circle r="13.6" fill="#000"/>
      <circle r="12.2" fill="url(#redPip)"/>
      <ellipse cx="3.2" cy="-4.4" rx="2.2" ry="3.2" fill="#ffd5c7" fill-opacity="0.58" transform="rotate(30 3.2 -4.4)"/>
    </g>
    <g id="pipWhite">
      <circle r="13.6" fill="#000"/>
      <circle r="12.2" fill="url(#whitePip)"/>
      <ellipse cx="3.2" cy="-4.4" rx="2.2" ry="3.2" fill="#fff" fill-opacity="0.52" transform="rotate(30 3.2 -4.4)"/>
    </g>

    <symbol id="tileTian" viewBox="0 0 84 200">
      <rect x="2" y="3" width="80" height="194" rx="9" fill="url(#tile)"/>
      <rect x="3.4" y="4.4" width="77.2" height="191.2" rx="7.8" fill="none" stroke="url(#tileEdge)" stroke-width="1.3"/>
      <use href="#pipWhite" x="25" y="28"/><use href="#pipRed" x="59" y="28"/>
      <use href="#pipWhite" x="25" y="55"/><use href="#pipRed" x="59" y="55"/>
      <use href="#pipWhite" x="25" y="82"/><use href="#pipRed" x="59" y="82"/>
      <use href="#pipRed" x="25" y="118"/><use href="#pipWhite" x="59" y="118"/>
      <use href="#pipRed" x="25" y="145"/><use href="#pipWhite" x="59" y="145"/>
      <use href="#pipRed" x="25" y="172"/><use href="#pipWhite" x="59" y="172"/>
    </symbol>
    <symbol id="tileNine" viewBox="0 0 84 200">
      <rect x="2" y="3" width="80" height="194" rx="9" fill="url(#tile)"/>
      <rect x="3.4" y="4.4" width="77.2" height="191.2" rx="7.8" fill="none" stroke="url(#tileEdge)" stroke-width="1.3"/>
      <use href="#pipRed" x="25" y="28"/><use href="#pipRed" x="59" y="28"/>
      <use href="#pipRed" x="25" y="82"/><use href="#pipRed" x="59" y="82"/>
      <use href="#pipWhite" x="25" y="118"/><use href="#pipWhite" x="59" y="118"/>
      <use href="#pipWhite" x="42" y="145"/>
      <use href="#pipWhite" x="25" y="172"/><use href="#pipWhite" x="59" y="172"/>
    </symbol>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#felt)"/>
  <circle cx="500" cy="448" r="395" fill="none" stroke="url(#medallion)" stroke-width="19" opacity="0.88"/>
  <circle cx="500" cy="448" r="368" fill="#063c2e" fill-opacity="0.42"/>

  <!-- 老者头像占据图标主体，神态亲切沉稳，缩小后仍能看出银发、布帽和笑容。 -->
  <g filter="url(#portraitShadow)">
    <path d="M86 1024c17-194 116-320 291-378 184-16 327 90 395 378Z" fill="url(#jacket)"/>
    <path d="M235 737c51 100 117 151 198 151 84 0 152-53 205-158l93 115c-58 119-157 179-296 179-142 0-242-62-301-187Z" fill="url(#collar)"/>
    <path d="M346 672c13 91 44 139 94 145 55-9 88-59 100-150Z" fill="#8c4b39"/>
    <path d="M339 702c17 67 49 101 96 103 49-2 84-37 103-105l-54-42c-12 39-29 59-51 59-23 0-41-20-54-59Z" fill="#f1e4ce"/>

    <path d="M218 363c-43 12-64 58-52 114 12 50 41 78 83 72l8-174Z" fill="#ab634a"/>
    <path d="M638 361c43 10 65 55 54 112-10 52-39 81-82 75l-8-175Z" fill="#7f3f34"/>
    <path d="M247 230c31-111 103-171 207-171 109 0 185 62 216 178l-21 292c-13 103-57 192-125 244-34 27-67 40-98 40-36 0-72-15-109-46-64-54-105-143-117-248Z" fill="url(#skin)"/>
    <path d="M473 78c121 27 183 117 187 270 2 133-23 249-76 348 43-105 57-216 41-333-15-111-66-206-152-285Z" fill="url(#skinShade)" opacity="0.74"/>

    <!-- 布帽使用厚实帽檐和侧面褶皱，增强新居村老人日常形象。 -->
    <path d="M235 249c18-127 101-204 220-205 114-1 196 68 224 190-70-46-142-68-216-68-79 0-155 28-228 83Z" fill="url(#cap)"/>
    <path d="M232 251c77-57 158-85 243-84 76 1 145 24 205 69-26 22-56 36-91 42-108-48-225-47-357 3Z" fill="#343a38"/>
    <path d="M281 173c49-49 111-75 184-77 61-1 116 15 165 49" fill="none" stroke="#e7e2d5" stroke-opacity="0.3" stroke-width="13" stroke-linecap="round"/>
    <path d="M273 257c-9 36-13 72-12 108M642 244c12 39 18 79 18 120" fill="none" stroke="#d7d3ca" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round"/>

    <!-- 眉眼、皱纹和法令纹保持低对比度，避免图标变成僵硬表情包。 -->
    <path d="M283 370c43-27 87-31 131-11M467 357c49-17 95-10 138 21" fill="none" stroke="#4a2925" stroke-width="16" stroke-linecap="round"/>
    <path d="M292 402c30-20 65-20 104 1-31 25-66 25-104-1ZM482 400c38-19 72-16 102 9-42 21-76 18-102-9Z" fill="#211817"/>
    <ellipse cx="349" cy="399" rx="7" ry="9" fill="#0d0c0c"/><ellipse cx="533" cy="402" rx="7" ry="9" fill="#0d0c0c"/>
    <circle cx="346" cy="395" r="3" fill="#ffe6be"/><circle cx="530" cy="398" r="3" fill="#ffe6be"/>
    <path d="M302 425c-22 4-40 15-55 34M589 429c22 5 40 17 54 36" fill="none" stroke="#704038" stroke-opacity="0.58" stroke-width="6" stroke-linecap="round"/>
    <path d="M432 401c-11 62-14 113-8 154 15 13 35 15 59 5" fill="none" stroke="#764238" stroke-width="11" stroke-linecap="round"/>
    <path d="M293 520c26 24 46 55 60 93M589 520c-24 26-42 57-54 94" fill="none" stroke="#64362f" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>

    <!-- 收敛的灰白胡须和微笑是人物识别重点，避免过度夸张。 -->
    <path d="M342 589c31-22 63-25 96-9 35-16 68-11 99 13" fill="none" stroke="#3a302d" stroke-width="17" stroke-linecap="round"/>
    <path d="M365 618c45 22 92 23 141 3" fill="none" stroke="#6d3531" stroke-width="10" stroke-linecap="round"/>
    <path d="M373 638c40 43 84 57 132 41 22-8 39-22 51-43-62 21-123 22-183 2Z" fill="#777872"/>
    <path d="M389 651c35 18 72 20 110 6" fill="none" stroke="#d4d1c6" stroke-opacity="0.38" stroke-width="7" stroke-linecap="round"/>
    <path d="M270 478c-18 5-32 15-43 30M622 482c18 5 32 16 42 31" fill="none" stroke="#7a4539" stroke-opacity="0.45" stroke-width="5"/>

    <path d="M130 958c94-88 197-134 309-137M744 954c-84-87-183-133-297-135" fill="none" stroke="#5f8090" stroke-opacity="0.52" stroke-width="14"/>
    <circle cx="438" cy="874" r="11" fill="#e2b83f"/>
    <circle cx="438" cy="922" r="11" fill="#e2b83f"/>
  </g>

  <!-- 天牌和九点牌置于前景，点位尺寸加大，应用列表小图标中也能一眼识别。 -->
  <g filter="url(#tileShadow)">
    <use href="#tileTian" x="672" y="500" width="151" height="360" transform="rotate(-10 747.5 680)"/>
    <use href="#tileNine" x="770" y="540" width="151" height="360" transform="rotate(8 845.5 720)"/>
  </g>
  <path d="M119 927c238 74 503 73 795-5" fill="none" stroke="#f1c958" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
</svg>
